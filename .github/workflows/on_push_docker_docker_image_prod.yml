name: Build and Push Django Image to GHCR

on:
  push:
    branches:
      - docker-image-prod

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./django_app/
          push: true
          tags: |
            ghcr.io/bnoahpro/django-app:prod
            ghcr.io/bnoahpro/django-app:${{ github.sha }}