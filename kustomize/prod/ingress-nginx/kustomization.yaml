apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      env: prod

components:
  - ../../base/ingress-nginx

helmCharts:
  - name: ingress-nginx
    version: 4.12.0
    namespace: ingress-nginx
    repo: https://kubernetes.github.io/ingress-nginx
    releaseName: ingress-nginx
    includeCRDs: true

namespace: ingress-nginx
