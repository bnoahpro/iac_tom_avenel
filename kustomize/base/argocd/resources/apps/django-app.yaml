---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: "https://github.com/bnoahpro/iac_tom_avenel.git"
    targetRevision: main
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
    automated: 
      prune: true
      selfHeal: true
  destination:
    namespace: argocd
    server: "https://kubernetes.default.svc"
